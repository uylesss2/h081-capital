[package]
name = "stipend_pool"
version = "0.1.0"
description = "Stipend shielded pool (H0.81 Capital): transact, grant, spend, delegate over SPL Token and Token-2022"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "stipend_pool"

[features]
default = []
# Localnet-only build with a separate program id that adds `probe_insert` so the Merkle module can be
# compared with src/merkle.ts. Never part of the production .so.
merkle-probe = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.1", features = ["event-cpi"] }
solana-bn254 = "=3.2.1"
solana-poseidon = "=5.0.1"
solana-sha256-hasher = "=3.1.0"
solana-keccak-hasher = "=3.1.0"
anchor-spl = { version = "=1.2.1", default-features = false, features = ["token", "token_2022", "solana-v3"] }
bytemuck = { version = "1", features = ["min_const_generics", "derive"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }
