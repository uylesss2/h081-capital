[package]
name = "stream_loan"
version = "0.1.0"
description = "StreamLoan registry (H0.81 Capital): loans against pledged stream allowances in stipend_pool"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "stream_loan"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Same anchor-lang as stipend_pool. No anchor-spl: token accounts are read and transfer_checked is
# built by hand (identical for SPL Token and Token-2022), and stipend_pool is reached by raw CPI, so
# this crate does not compile the pool's source.
anchor-lang = { version = "=1.2.1", features = ["init-if-needed"] }
solana-sha256-hasher = "=3.1.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }
